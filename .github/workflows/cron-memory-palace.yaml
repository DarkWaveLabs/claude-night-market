name: Memory Palace Lifecycle Cron

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'

jobs:
  vitality-decay-dry-run:
    name: Run vitality decay dry-run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.19"
      - name: Run vitality decay
        run: |
          uv run python plugins/memory-palace/scripts/update_vitality_scores.py --dry-run --queue-file plugins/memory-palace/data/indexes/vitality-tending-queue.json
