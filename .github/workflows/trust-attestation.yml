name: Trust Attestation

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  attestations: write

jobs:
  attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # `make test` runs every plugin suite, and pensive's shell-review
      # suite shells out to all three of these. Without them the sweep
      # failed on `FileNotFoundError: 'rg'` while the shellcheck and
      # shfmt tests skipped, and this is the job whose report gets
      # signed: an attestation naming a suite as passed is a claim about
      # tests that ran. Same block as plugin-tests.yml, shfmt pin
      # included.
      - name: Install shell tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck ripgrep
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64
          # sha256 from the release's sha256sums.txt
          echo "1f57a384d59542f8fac5f503da1f3ea44242f46dff969569e80b524d64b71dbc  /tmp/shfmt" | sha256sum -c -
          sudo install -m 0755 /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version
          rg --version

      - name: Run tests and capture results
        run: |
          # Without this the step's exit code is tee's, which is always 0,
          # so a red suite still produced a signed attestation reporting a
          # green one. tome-integration.yml already sets it; this step did
          # not, and this is the step whose output gets signed.
          set -o pipefail
          make test 2>&1 | tee test-output.txt
          COMMIT_SHA="$(git rev-parse HEAD)"
          python3 -c "
          import json, os, re, sys
          text = open('test-output.txt').read()
          passed = re.findall(r'Passed \((\d+)\):\s*(.+)', text)
          failed = re.findall(r'Failed \((\d+)\):\s*(.+)', text)
          skipped = re.findall(r'Skipped \((\d+)\):\s*(.+)', text)
          report = {
              'version': '1.0',
              'passed': passed[0][1].split() if passed else [],
              'failed': failed[0][1].split() if failed else [],
              'skipped': skipped[0][1].split() if skipped else [],
              'total_plugins': 23,
              'commit': os.environ['COMMIT_SHA'],
          }
          json.dump(report, open('trust-report.json', 'w'), indent=2)
          print(json.dumps(report, indent=2))
          "
        env:
          COMMIT_SHA: ${{ github.sha }}
      - name: Generate SLSA attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: trust-report.json
